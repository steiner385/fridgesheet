[project]
name = "lakota-grades-mcp"
version = "0.1.0"
description = "Local MCP server exposing Canvas + Home Access Center (HAC) data for the Stein kids, authenticated via 1Password."
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = [
    "mcp>=1.2,<3",
    "playwright>=1.45",
    "python-dotenv>=1.0",
]

[project.scripts]
lakota-grades = "lakota_grades.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lakota_grades*"]
