[project]
name = "lakota-grades-mcp"
version = "0.3.1"
description = "Lakota Local Schools parent tools: a printed open-work sheet from Canvas + Home Access Center, and a local MCP server for Claude."
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "mcp>=1.2,<3",
    "playwright>=1.45",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "reportlab>=4",
    "segno>=1.6",
    "tomli-w>=1.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
windows = ["keyring>=25", "pywin32>=306"]

[project.scripts]
lakota-grades = "lakota_grades.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    # starlette.testclient's own module-level type annotation touches the deprecated
    # anyio.abc.BlockingPortal alias; nothing in this repo imports it directly, and the
    # installed starlette (1.6.0, latest at time of writing) has not been updated yet.
    "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated.*:DeprecationWarning:starlette\\.testclient",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lakota_grades*"]

[tool.setuptools.package-data]
lakota_grades = ["host/*.xml", "web/templates/*.html", "web/static/*"]
