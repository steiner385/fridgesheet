  <rect x="15" y="12" width="34" height="42" rx="4" fill="#ffffff"/>
  <path d="M22 30h20M22 39h14" stroke="#94a3b8" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="32" cy="14" r="6.5" fill="#f26b5b"/>
  <circle cx="30.2" cy="12.2" r="2" fill="#ffffff" fill-opacity="0.55"/>
</svg>
