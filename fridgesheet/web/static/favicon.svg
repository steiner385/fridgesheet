<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Fridge Sheet: a sheet of paper held to the fridge by one round magnet.
       Source of truth for every rendered size (favicon, PNGs, the Windows .ico): see
       scripts/render_mark.py. Shapes are kept coarse on purpose so the mark still reads at
       16 px: the slate square is the fridge door, the white rounded rectangle the sheet, two
       rule lines the list, the coral dot the magnet. -->
