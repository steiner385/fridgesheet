<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Who's looking? · Fridge Sheet</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/app.css?v={{ version }}">
</head>
{# A page of its own: no rail (which would name every child), no status bar. One tap, and
   the browser remembers (spec 2026-09-27 §13.1). #}
<body class="print-page">
<main>
  <div class="who">
    <h1><a href="/who" class="brand"><img src="/static/mark.svg" alt="" width="28" height="28"> Fridge Sheet</a></h1>
    <h2>{{ 'copy.who_looking' | say('') }}</h2>
    <p class="muted">{{ 'copy.who_remember' | say('') }}</p>
    <form method="post" action="/who">
      {% for s in kids %}<button name="who" value="{{ s.key }}"{% if s.key | tier_of %} data-tier="{{ s.key | tier_of }}"{% endif %}>{{ s.key | nickname }}</button>{% endfor %}
      <button name="who" value="family" class="grownup">{{ 'copy.a_grownup' | say('') }}</button>
    </form>
  </div>
</main>
</body>
</html>
