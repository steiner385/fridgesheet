{% extends "base.html" %}
{% block title %}{{ student.key | nickname }} · Fridge Sheet{% endblock %}
{% block content %}
<h2>{{ student.key | nickname }}</h2>
<form class="filters" hx-get="/kids/{{ student.key }}" hx-target="#items" hx-push-url="true" hx-trigger="change">
  <label>Show
    <select name="show">{% for v in SHOW %}<option value="{{ v }}" {{ 'selected' if f.show == v }}>{{ v }}</option>{% endfor %}</select></label>
  <label>Source
    <select name="source"><option value="">all</option>{% for v in ("canvas", "hac", "both") %}<option value="{{ v }}" {{ 'selected' if f.source == v }}>{{ v }}</option>{% endfor %}</select></label>
  <label>Course
    <select name="course"><option value="">any</option>{% for cid, label in course_options %}<option value="{{ cid }}" {{ 'selected' if f.course_id == cid }}>{{ label }}</option>{% endfor %}</select></label>
  <label>Kind
    <select name="kind"><option value="">any</option>{% for v in ("online", "paper", "in class") %}<option value="{{ v }}" {{ 'selected' if f.kind == v }}>{{ v }}</option>{% endfor %}</select></label>
  <label>Flagged
    <select name="flagged"><option value="">all</option>{% for v in FLAGGED %}<option value="{{ v }}" {{ 'selected' if f.flagged == v }}>{{ 'any flag' if v == 'any' else v }}</option>{% endfor %}</select></label>
  <label>Outcome
    <select name="outcome"><option value="">any</option>{% for v in OUTCOMES %}<option value="{{ v }}" {{ 'selected' if f.outcome == v }}>{{ OUTCOME_LABELS[v] }}</option>{% endfor %}</select></label>
  <input type="hidden" name="sort" value="{{ f.sort }}">
</form>
<div id="items">
{% block partial %}
{% include "_item_rows.html" %}
{% endblock %}
</div>
{% endblock %}
